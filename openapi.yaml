---
openapi: 3.0.3
info:
  title: Gatekeeper API
  version: 1.0.0
  description: Event ticketing and transactional booking API
servers:
  - url: /
    description: Current host

paths:
  /health:
    get:
      summary: Health check
      description: Checks if the API and database are reachable.
      responses:
        '200':
          description: App and database are OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  database:
                    type: string
                    example: ok
        '503':
          description: Database unreachable

  /events:
    post:
      summary: Create a new event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - venue
                - starts_at
                - capacity
              properties:
                name:
                  type: string
                  example: Concert
                venue:
                  type: string
                  example: Paris
                starts_at:
                  type: string
                  format: date-time
                capacity:
                  type: integer
                  minimum: 0
      responses:
        '201':
          description: Event created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      summary: List all events (keyset pagination)
      parameters:
        - name: after
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: List of events
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Event'
                  next_cursor:
                    type: integer
                    nullable: true

  /events/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Get an event by ID
      responses:
        '200':
          description: Event details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          description: Invalid ID format
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /events/{id}/bookings:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    post:
      summary: Book tickets for an event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - customer_id
                - quantity
              properties:
                customer_id:
                  type: integer
                quantity:
                  type: integer
                  minimum: 1
                  maximum: 10
      responses:
        '201':
          description: Booking created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          description: Unknown customer, bad quantity, or invalid ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Sold out or not enough seats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      summary: List bookings for an event (keyset pagination)
      parameters:
        - name: after
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: List of bookings
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Booking'
                  next_cursor:
                    type: integer
                    nullable: true
        '400':
          description: Invalid ID format
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /bookings/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Get a booking by ID
      responses:
        '200':
          description: Booking details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          description: Invalid ID format
        '404':
          description: Booking not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /bookings/{id}/cancel:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    post:
      summary: Cancel a booking
      responses:
        '204':
          description: Booking cancelled and seats restored
        '400':
          description: Invalid ID format
        '404':
          description: Booking not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Booking already cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    Event:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        venue:
          type: string
        starts_at:
          type: string
          format: date-time
        capacity:
          type: integer
        seats_remaining:
          type: integer
        status:
          type: string
          enum: [on_sale, sold_out, cancelled]
    Booking:
      type: object
      properties:
        id:
          type: integer
        event_id:
          type: integer
        customer_id:
          type: integer
        quantity:
          type: integer
        status:
          type: string
          enum: [confirmed, cancelled]
        booked_at:
          type: string
          format: date-time
    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        issues:
          type: array
          items:
            type: object
            properties:
              path:
                type: array
                items:
                  type: string
              message:
                type: string