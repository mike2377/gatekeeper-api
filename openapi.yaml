---
openapi: 3.0.3
info:
  title: Gatekeeper API
  version: 1.0.0
  description: Event ticketing and transactional booking API
servers:
  - url: /
    description: Current host
paths:
  /health:
    get:
      summary: Health check
      description: Checks if the API and database are reachable.
      responses:
        '200':
          description: App and database are OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  database:
                    type: string
                    example: ok
        '503':
          description: Database unreachable
  /events:
    post:
      summary: Create a new event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - venue
                - starts_at
                - capacity
              properties:
                name:
                  type: string
                  example: Concert
                venue:
                  type: string
                  example: Paris
                starts_at:
                  type: string
                  format: date-time
                capacity:
                  type: integer
                  minimum: 0
      responses:
        '201':
          description: Event created
        '400':
          description: Invalid input
    get:
      summary: List all events (keyset pagination)
      parameters:
        - name: after
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: List of events
  /events/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Get an event by ID
      responses:
        '200':
          description: Event details
        '404':
          description: Event not found
  /events/{id}/bookings:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    post:
      summary: Book tickets for an event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - customer_id
                - quantity
              properties:
                customer_id:
                  type: integer
                quantity:
                  type: integer
                  minimum: 1
                  maximum: 10
      responses:
        '201':
          description: Booking created
        '400':
          description: Unknown customer or bad quantity
        '409':
          description: Sold out or not enough seats
    get:
      summary: List bookings for an event
      responses:
        '200':
          description: List of bookings
  /bookings/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Get a booking by ID
      responses:
        '200':
          description: Booking details
        '404':
          description: Booking not found
  /bookings/{id}/cancel:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    post:
      summary: Cancel a booking
      responses:
        '204':
          description: Booking cancelled and seats restored
        '404':
          description: Booking not found
        '409':
          description: Booking already cancelled